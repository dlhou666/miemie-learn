<!DOCTYPE html>
<html lang="zh-CN" data-theme="sky">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="咩咩学" />
<meta name="theme-color" content="#EDF5FC" />
<meta name="format-detection" content="telephone=no" />
<title>咩咩学</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
<link rel="apple-touch-icon" sizes="167x167" href="icons/icon-167.png" />
<link rel="apple-touch-icon" sizes="152x152" href="icons/icon-152.png" />
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
<link rel="stylesheet" href="css/app.css" />
</head>
<body>

<div class="sky" aria-hidden="true">
  <span class="cl c1"></span><span class="cl c2"></span><span class="cl c3"></span>
</div>

<div class="app" id="app">

  <header class="topbar">
    <button class="chip profile" id="btnProfile" type="button">
      <span class="avatar" id="topAvatar">🐑</span>
      <span class="profile-name" id="profileName">小咩</span>
      <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="brand" id="btnBrand" role="button" tabindex="0">
      <span class="logo" id="brandLogo">🌸</span>
      <span class="brand-name" id="brandName">咩咩学</span>
    </div>

    <button class="chip flower" id="btnFlowers" type="button">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
        <g fill="currentColor">
          <circle cx="10" cy="5" r="3.1"/><circle cx="15.2" cy="8.4" r="3.1"/>
          <circle cx="12.9" cy="15" r="3.1"/><circle cx="7.1" cy="15" r="3.1"/>
          <circle cx="4.8" cy="8.4" r="3.1"/>
        </g>
        <circle cx="10" cy="10" r="3.2" fill="#FFD451"/>
      </svg>
      <b id="flowerCount">0</b>
    </button>
  </header>

  <main class="main">
    <section class="view is-active" data-view="today"><div class="scroll" id="vToday"></div></section>
    <section class="view" data-view="plan"><div class="scroll" id="vPlan"></div></section>
    <section class="view" data-view="shop"><div class="scroll" id="vShop"></div></section>
    <section class="view" data-view="honor"><div class="scroll" id="vHonor"></div></section>
    <section class="view" data-view="parent"><div class="scroll" id="vParent"></div></section>
  </main>

  <nav class="tabbar" id="tabbar">
    <button class="tab is-active" data-go="today" type="button">
      <span class="tab-ico"><svg width="24" height="24" viewBox="0 0 20 20" fill="none"><path d="M3 9.5 10 3l7 6.5V17a1 1 0 0 1-1 1h-4v-4.5H8V18H4a1 1 0 0 1-1-1z" fill="currentColor"/></svg></span>
      <span>今日</span>
    </button>
    <button class="tab" data-go="plan" type="button">
      <span class="tab-ico"><svg width="24" height="24" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="4" width="15" height="13.5" rx="2.5" stroke="currentColor" stroke-width="1.8"/><path d="M2.5 8h15" stroke="currentColor" stroke-width="1.8"/><path d="M6.5 2v3.5M13.5 2v3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
      <span>计划</span>
    </button>
    <button class="tab" data-go="shop" type="button">
      <span class="tab-ico"><svg width="24" height="24" viewBox="0 0 20 20" fill="none"><rect x="2.5" y="7" width="15" height="3.5" rx="1" stroke="currentColor" stroke-width="1.7"/><path d="M4 10.5h12V16a1.5 1.5 0 0 1-1.5 1.5h-9A1.5 1.5 0 0 1 4 16z" stroke="currentColor" stroke-width="1.7"/><path d="M10 7v10.5" stroke="currentColor" stroke-width="1.7"/><path d="M10 7C8.2 7 6.5 6 6.5 4.4 6.5 3 8.8 2.6 10 7c1.2-4.4 3.5-4 3.5-2.6C13.5 6 11.8 7 10 7z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
      <span>商城</span>
    </button>
    <button class="tab" data-go="honor" type="button">
      <span class="tab-ico"><svg width="24" height="24" viewBox="0 0 20 20" fill="none"><path d="M10 2.2l2.3 4.7 5.2.75-3.75 3.65.9 5.2L10 14.05 5.35 16.5l.9-5.2L2.5 7.65l5.2-.75z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg></span>
      <span>荣誉</span>
    </button>
    <button class="tab" data-go="parent" type="button">
      <span class="tab-ico"><svg width="24" height="24" viewBox="0 0 20 20" fill="none"><path d="M10 2l7 3v5c0 4.2-3 7-7 8.5C6 17 3 14.2 3 10V5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M7.2 10l2 2 3.6-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      <span>家长</span>
    </button>
  </nav>
</div>

<div class="modal-root" id="modalRoot" hidden>
  <div class="mask" id="mask"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-bar"><span class="sheet-grip"></span></div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
